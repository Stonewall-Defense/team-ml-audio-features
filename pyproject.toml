[project]
name = "AudioMlSpecTools"
version = "v0.16.0"

authors = [
  { name="Ryan Quinn", email="ryan.quinn@certusinnovations.com" },
]
description = "Convenience functions for generating ML features from audio data"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
license = "MIT"
license-files = ["LICENSE*"]

dependencies = [
    "click ~= 8.4",
    "matplotlib ~= 3.10",
    "numpy ~= 2.4",
    "playsound3 ~= 3.3",
    "scikit-maad ~= 1.5",
    "scipy ~= 1.15",
    "soundfile ~= 0.13",
    "tinytag ~= 2.2",
    "torch ~= 2.10",
]

[project.optional-dependencies]
test = [
    "coverage ~= 7.13",
]

[project.urls]
Homepage = "https://github.com/Stonewall-Defense/team-ml-audio-features"

[project.scripts]
audiomltools = "AudioMlSpecTools._exec:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["AudioMlSpecTools*"]
