[project]
name = "audiofeatures"
version = "v0.4.2"
authors = [
  { name="Ryan Quinn", email="ryan.quinn@certusinnovations.com" },
]
description = "Convenience functions for generating ML features from audio data"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
license = "MIT"
license-files = ["LICENSE*"]

[project.urls]
Homepage = "https://github.com/Stonewall-Defense/team-ml-audio-features"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiofeatures*"]